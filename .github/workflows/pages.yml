name: Deploy College Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch homepage search
        run: python3 scripts/patch-homepage-search.py
      - name: Build automatic college search index
        run: python3 scripts/generate-search-index.py
      - name: Patch moved-page search routes
        run: python3 scripts/patch-search-index.py
      - name: Sanitize MNIT Jaipur overview
        run: python3 scripts/patch-mnit-jaipur-overview.py
      - name: Expand Jaipuria Jaipur FAQs
        run: python3 scripts/patch-jaipuria-jaipur-faq.py
      - name: Normalize college hero containers
        run: python3 scripts/normalize-hero.py
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: college-decoded-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: college-decoded-pages
