name: Validate CollegeCMS newsroom
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/hybrid-newsroom]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate server and newsroom UI syntax
        run: node scripts/validate-newsroom.js
